<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ImGui Live Editor · C++</title>
  <!-- Подключаем шрифт для единообразия -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* верхняя панель подсказка */
    .toolbar {
      background: #2a2a2a;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3a3a3a;
      flex-shrink: 0;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
    .toolbar span:first-child {
      color: #aaa;
    }
    .toolbar span:last-child {
      background: #3a3a3a;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #8cf;
      border: 1px solid #4a4a4a;
    }

    .split-container {
      display: flex;
      flex: 1;
      min-height: 0; /* для корректного сжатия */
    }

    /* левая панель — редактор кода */
    .code-panel {
      flex: 1 1 50%;
      background: #1e1e1e;
      border-right: 2px solid #333;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-panel .header {
      background: #252525;
      padding: 6px 16px;
      border-bottom: 1px solid #3a3a3a;
      font-size: 13px;
      color: #ccc;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .code-panel .header .lang {
      background: #3a3a3a;
      padding: 0 12px;
      border-radius: 12px;
      font-size: 11px;
      color: #8cf;
    }

    #codeEditor {
      flex: 1;
      width: 100%;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      outline: none;
      resize: none;
      padding: 20px 18px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 14px;
      line-height: 1.7;
      tab-size: 2;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
    }
    #codeEditor::selection {
      background: #4a6a8a;
    }

    /* правая панель — превью ImGui */
    .preview-panel {
      flex: 1 1 50%;
      background: #1c1c1c;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-panel .header {
      background: #252525;
      padding: 6px 16px;
      border-bottom: 1px solid #3a3a3a;
      font-size: 13px;
      color: #ccc;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .preview-panel .header .status {
      color: #6a6;
      font-size: 12px;
    }

    #previewFrame {
      flex: 1;
      width: 100%;
      border: none;
      background: #1c1c1c;
      display: block;
    }

    /* кнопка снизу для быстрого применения (опционально) */
    .action-bar {
      background: #222;
      padding: 6px 20px;
      border-top: 1px solid #333;
      display: flex;
      gap: 16px;
      flex-shrink: 0;
      align-items: center;
    }
    .action-bar button {
      background: #3a5a7a;
      border: none;
      color: white;
      padding: 4px 18px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .action-bar button:hover {
      background: #4a7a9a;
      transform: scale(1.02);
    }
    .action-bar .hint {
      color: #777;
      font-size: 12px;
    }

    /* адаптив — на узких экранах стек */
    @media (max-width: 720px) {
      .split-container {
        flex-direction: column;
      }
      .code-panel {
        border-right: none;
        border-bottom: 2px solid #333;
        flex: 1 1 50%;
        min-height: 40vh;
      }
      .preview-panel {
        flex: 1 1 50%;
        min-height: 40vh;
      }
    }

    /* скролл для редактора */
    #codeEditor::-webkit-scrollbar {
      width: 8px;
      background: #1e1e1e;
    }
    #codeEditor::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 6px;
    }
    #codeEditor::-webkit-scrollbar-thumb:hover {
      background: #5a5a5a;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span>🧩 ImGui · интерактивный редактор</span>
    <span>⚡ C++ · реальное время</span>
  </div>

  <div class="split-container">
    <!-- левая часть: редактор -->
    <div class="code-panel">
      <div class="header">
        <span>📄 <strong>код дизайна</strong> (ImGui C++)</span>
        <span class="lang">C++</span>
      </div>
      <textarea id="codeEditor" spellcheck="false" autofocus>// === Пример меню ImGui (C++) ===
// Изменяй — справа сразу видно!

ImGui::Begin("Меню", nullptr, ImGuiWindowFlags_None);

if (ImGui::BeginTabBar("MainTabs")) {
    if (ImGui::BeginTabItem("Настройки")) {
        ImGui::Text("Параметры окна");
        static float val = 0.5f;
        ImGui::SliderFloat("Прозрачность", &val, 0.0f, 1.0f);
        ImGui::Checkbox("Включить тень", &static_cast<bool&>(true));
        ImGui::EndTabItem();
    }
    if (ImGui::BeginTabItem("Эффекты")) {
        ImGui::Text("Эффекты пост-обработки");
        static int effect = 0;
        ImGui::RadioButton("None", &effect, 0);
        ImGui::RadioButton("Blur", &effect, 1);
        ImGui::RadioButton("Glow", &effect, 2);
        ImGui::EndTabItem();
    }
    if (ImGui::BeginTabItem("Инфо")) {
        ImGui::Text("ImGui версия: 1.90");
        ImGui::Text("C++ код обновляется live");
        if (ImGui::Button("Применить")) {
            // симуляция действия
        }
        ImGui::EndTabItem();
    }
    ImGui::EndTabBar();
}

ImGui::End();</textarea>
    </div>

    <!-- правая часть: превью ImGui -->
    <div class="preview-panel">
      <div class="header">
        <span>🖥️ <strong>предпросмотр</strong> (ImGui)</span>
        <span class="status">● живой рендеринг</span>
      </div>
      <iframe id="previewFrame" srcdoc="
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset='utf-8'>
          <style>
            body { margin:0; background:#1c1c1c; display:flex; align-items:center; justify-content:center; height:100vh; font-family:system-ui; }
            .imgui-window { background:#2a2a2a; border-radius:12px; padding:24px 28px; min-width:320px; max-width:90%; box-shadow:0 12px 40px rgba(0,0,0,0.7); border:1px solid #4a4a4a; color:#ddd; }
            .imgui-window h2 { margin:0 0 12px 0; font-weight:400; font-size:20px; color:#eee; letter-spacing:0.3px; border-bottom:1px solid #3a3a3a; padding-bottom:8px; }
            .imgui-tab-bar { display:flex; gap:4px; margin:8px 0 16px 0; border-bottom:1px solid #3a3a3a; }
            .imgui-tab { padding:6px 16px; border-radius:6px 6px 0 0; background:#333; color:#aaa; cursor:default; border:1px solid #3a3a3a; border-bottom:none; }
            .imgui-tab.active { background:#3a5a7a; color:#fff; border-color:#4a7a9a; }
            .imgui-content { padding:8px 0; }
            .imgui-text { margin:6px 0; }
            .imgui-slider { display:flex; align-items:center; gap:12px; margin:10px 0; }
            .imgui-slider input { width:100%; background:#3a3a3a; height:4px; border-radius:4px; accent-color:#6a9acf; }
            .imgui-slider span { min-width:40px; color:#ccc; }
            .imgui-check { display:flex; align-items:center; gap:8px; margin:6px 0; }
            .imgui-check input { accent-color:#6a9acf; width:16px; height:16px; }
            .imgui-radio-group { margin:6px 0; display:flex; gap:12px; flex-wrap:wrap; }
            .imgui-radio-group label { display:flex; align-items:center; gap:4px; }
            .imgui-btn { background:#3a5a7a; border:none; color:white; padding:6px 18px; border-radius:20px; margin-top:12px; cursor:default; }
            .imgui-btn:hover { background:#4a7a9a; }
            .imgui-footer { margin-top:16px; font-size:12px; color:#666; border-top:1px solid #2a2a2a; padding-top:10px; text-align:center; }
          </style>
        </head>
        <body>
          <div class='imgui-window'>
            <h2>⚙️ Меню (дефолтный вид)</h2>
            <div class='imgui-tab-bar'>
              <div class='imgui-tab active'>Настройки</div>
              <div class='imgui-tab'>Эффекты</div>
              <div class='imgui-tab'>Инфо</div>
            </div>
            <div class='imgui-content'>
              <div class='imgui-text'>Параметры окна</div>
              <div class='imgui-slider'>
                <span>Прозрачность</span>
                <input type='range' min='0' max='1' step='0.01' value='0.5'>
                <span>0.50</span>
              </div>
              <div class='imgui-check'>
                <input type='checkbox' checked> <span>Включить тень</span>
              </div>
              <div style='margin-top:12px; border-top:1px solid #2a2a2a; padding-top:12px;'>
                <div class='imgui-text' style='color:#aaa;'>Эффекты пост-обработки</div>
                <div class='imgui-radio-group'>
                  <label><input type='radio' name='effect' checked> None</label>
                  <label><input type='radio' name='effect'> Blur</label>
                  <label><input type='radio' name='effect'> Glow</label>
                </div>
              </div>
              <button class='imgui-btn'>Применить</button>
            </div>
            <div class='imgui-footer'>ImGui 1.90 · C++ live preview</div>
          </div>
        </body>
        </html>
      "></iframe>
    </div>
  </div>

  <div class="action-bar">
    <button id="applyCodeBtn">⟳ Применить код</button>
    <span class="hint">(изменяй код слева — превью обновится)</span>
    <span style="margin-left:auto; color:#666; font-size:12px;">⚡ GitHub Pages ready</span>
  </div>

  <script>
    (function() {
      const editor = document.getElementById('codeEditor');
      const previewFrame = document.getElementById('previewFrame');

      // --- парсинг "C++ кода" и превращение в минимальный HTML рендеринг ImGui ---
      function generatePreviewFromCode(code) {
        // Базовый HTML с обёрткой, поверх которой накладываем наши "виджеты"
        // Используем упрощённый парсинг: ищем ключевые слова ImGui и рисуем примитивы.
        // Это демо-пример, который показывает как код влияет на визуал.
        // Поддерживаются: Begin, End, BeginTabBar, BeginTabItem, EndTabBar, EndTabItem,
        // Text, SliderFloat, Checkbox, RadioButton, Button

        let html = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <style>
            body { margin:0; background:#1c1c1c; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:system-ui, sans-serif; padding:16px; }
            .imgui-window { background:#2a2a2a; border-radius:12px; padding:20px 24px; min-width:300px; max-width:92%; box-shadow:0 12px 40px rgba(0,0,0,0.7); border:1px solid #4a4a4a; color:#ddd; width:fit-content; margin:auto; }
            .imgui-window h2 { margin:0 0 8px 0; font-weight:400; font-size:20px; color:#eee; border-bottom:1px solid #3a3a3a; padding-bottom:6px; }
            .imgui-tab-bar { display:flex; gap:4px; margin:8px 0 12px 0; border-bottom:1px solid #3a3a3a; flex-wrap:wrap; }
            .imgui-tab { padding:4px 14px; border-radius:6px 6px 0 0; background:#333; color:#aaa; cursor:default; border:1px solid #3a3a3a; border-bottom:none; font-size:14px; }
            .imgui-tab.active { background:#3a5a7a; color:#fff; border-color:#4a7a9a; }
            .imgui-content { padding:4px 0; }
            .imgui-text { margin:6px 0; }
            .imgui-slider { display:flex; align-items:center; gap:10px; margin:8px 0; }
            .imgui-slider input { width:140px; background:#3a3a3a; height:4px; border-radius:4px; accent-color:#6a9acf; }
            .imgui-slider span { min-width:40px; color:#ccc; font-size:14px; }
            .imgui-check { display:flex; align-items:center; gap:6px; margin:4px 0; }
            .imgui-check input { accent-color:#6a9acf; width:16px; height:16px; }
            .imgui-radio-group { margin:6px 0; display:flex; gap:12px; flex-wrap:wrap; }
            .imgui-radio-group label { display:flex; align-items:center; gap:4px; font-size:14px; }
            .imgui-btn { background:#3a5a7a; border:none; color:white; padding:4px 18px; border-radius:20px; margin-top:8px; cursor:default; font-size:14px; }
            .imgui-btn:hover { background:#4a7a9a; }
            .imgui-footer { margin-top:12px; font-size:12px; color:#666; border-top:1px solid #2a2a2a; padding-top:8px; text-align:center; }
            .imgui-separator { border-top:1px solid #2a2a2a; margin:8px 0; }
          </style>
        </head>
        <body>
          <div class="imgui-window">
            <h2>⚙️ Меню</h2>
        `;

        // Парсим код построчно (очень упрощённо)
        const lines = code.split('\n');
        let inTabBar = false;
        let activeTab = null;
        let tabItems = [];
        let insideTabItem = false;
        let currentTabLabel = '';
        let contentHtml = '';
        let hasContent = false;

        // Функция для добавления содержимого в текущий таб или в общий контент
        function appendContent(str) {
          if (insideTabItem) {
            contentHtml += str;
          } else {
            // если не внутри таба, добавляем в основной блок (но для демо просто добавим)
            contentHtml += str;
          }
          hasContent = true;
        }

        // Простейший парсер
        for (let line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;

          // Проверяем BeginTabBar
          if (trimmed.includes('BeginTabBar')) {
            inTabBar = true;
            continue;
          }
          if (trimmed.includes('EndTabBar')) {
            inTabBar = false;
            // закрываем таббар
            continue;
          }

          // BeginTabItem
          if (trimmed.includes('BeginTabItem')) {
            const match = trimmed.match(/BeginTabItem\s*\(\s*["']([^"']+)["']/);
            if (match) {
              currentTabLabel = match[1];
              insideTabItem = true;
              // добавляем таб в бар (если ещё не добавлен)
              if (!tabItems.includes(currentTabLabel)) {
                tabItems.push(currentTabLabel);
              }
            }
            continue;
          }
          if (trimmed.includes('EndTabItem')) {
            insideTabItem = false;
            continue;
          }

          // Обработка виджетов
          if (trimmed.includes('Text')) {
            const match = trimmed.match(/Text\s*\(\s*["']([^"']+)["']/);
            if (match) {
              appendContent(`<div class="imgui-text">${match[1]}</div>`);
            }
            continue;
          }

          if (trimmed.includes('SliderFloat')) {
            const match = trimmed.match(/SliderFloat\s*\(\s*["']([^"']+)["']/);
            if (match) {
              const label = match[1];
              appendContent(`
                <div class="imgui-slider">
                  <span>${label}</span>
                  <input type="range" min="0" max="1" step="0.01" value="0.5">
                  <span>0.50</span>
                </div>
              `);
            }
            continue;
          }

          if (trimmed.includes('Checkbox')) {
            const match = trimmed.match(/Checkbox\s*\(\s*["']([^"']+)["']/);
            if (match) {
              const label = match[1];
              appendContent(`
                <div class="imgui-check">
                  <input type="checkbox" checked> <span>${label}</span>
                </div>
              `);
            }
            continue;
          }

          if (trimmed.includes('RadioButton')) {
            const match = trimmed.match(/RadioButton\s*\(\s*["']([^"']+)["']/);
            if (match) {
              const label = match[1];
              appendContent(`
                <div class="imgui-radio-group">
                  <label><input type="radio" name="effect" checked> ${label}</label>
                </div>
              `);
            }
            continue;
          }

          if (trimmed.includes('Button')) {
            const match = trimmed.match(/Button\s*\(\s*["']([^"']+)["']/);
            if (match) {
              const label = match[1];
              appendContent(`<button class="imgui-btn">${label}</button>`);
            }
            continue;
          }

          // Если встретили Begin без таба — просто заголовок окна
          if (trimmed.includes('Begin') && !trimmed.includes('BeginTab')) {
            // ничего не делаем, уже есть заголовок
          }
        }

        // Генерируем таб-бар если есть табы
        if (tabItems.length > 0) {
          html += `<div class="imgui-tab-bar">`;
          for (let i = 0; i < tabItems.length; i++) {
            const cls = (i === 0) ? 'imgui-tab active' : 'imgui-tab';
            html += `<div class="${cls}">${tabItems[i]}</div>`;
          }
          html += `</div>`;
        }

        // Добавляем содержимое (если есть)
        if (contentHtml) {
          html += `<div class="imgui-content">${contentHtml}</div>`;
        } else {
          // если ничего не спарсили — покажем дефолтный контент
          html += `
            <div class="imgui-content">
              <div class="imgui-text">Настройки окна</div>
              <div class="imgui-slider"><span>Прозрачность</span><input type="range" value="0.5"><span>0.50</span></div>
              <div class="imgui-check"><input type="checkbox" checked> <span>Включить тень</span></div>
              <div class="imgui-separator"></div>
              <div class="imgui-text">Эффекты</div>
              <div class="imgui-radio-group"><label><input type="radio" name="eff" checked> None</label><label><input type="radio" name="eff"> Blur</label></div>
              <button class="imgui-btn">Применить</button>
            </div>
          `;
        }

        html += `
            <div class="imgui-footer">ImGui 1.90 · C++ live</div>
          </div>
        </body>
        </html>
        `;

        return html;
      }

      // --- обновление превью ---
      function updatePreview() {
        const code = editor.value;
        const previewHtml = generatePreviewFromCode(code);
        previewFrame.srcdoc = previewHtml;
      }

      // --- события ---
      editor.addEventListener('input', updatePreview);

      document.getElementById('applyCodeBtn').addEventListener('click', updatePreview);

      // инициализация
      updatePreview();

      // дополнительно: подсветка (можно было бы добавить, но для простоты оставим)
      console.log('ImGui Live Editor готов!');
    })();
  </script>
</body>
</html>
