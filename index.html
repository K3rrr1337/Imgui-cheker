<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ImGui Live Editor · C++</title>
  <!-- Подключаем шрифт для единообразия -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* верхняя панель подсказка */
    .toolbar {
      background: #2a2a2a;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3a3a3a;
      flex-shrink: 0;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
    .toolbar span:first-child {
      color: #aaa;
    }
    .toolbar span:last-child {
      background: #3a3a3a;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #8cf;
      border: 1px solid #4a4a4a;
    }

    .split-container {
      display: flex;
      flex: 1;
      min-height: 0; /* для корректного сжатия */
    }

    /* левая панель — редактор кода */
    .code-panel {
      flex: 1 1 50%;
      background: #1e1e1e;
      border-right: 2px solid #333;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-panel .header {
      background: #252525;
      padding: 6px 16px;
      border-bottom: 1px solid #3a3a3a;
      font-size: 13px;
      color: #ccc;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .code-panel .header .lang {
      background: #3a3a3a;
      padding: 0 12px;
      border-radius: 12px;
      font-size: 11px;
      color: #8cf;
    }

    #codeEditor {
      flex: 1;
      width: 100%;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      outline: none;
      resize: none;
      padding: 20px 18px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 14px;
      line-height: 1.7;
      tab-size: 2;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
    }
    #codeEditor::selection {
      background: #4a6a8a;
    }

    /* правая панель — превью ImGui */
    .preview-panel {
      flex: 1 1 50%;
      background: #1c1c1c;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-panel .header {
      background: #252525;
      padding: 6px 16px;
      border-bottom: 1px solid #3a3a3a;
      font-size: 13px;
      color: #ccc;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .preview-panel .header .status {
      color: #6a6;
      font-size: 12px;
    }

    #previewFrame {
      flex: 1;
      width: 100%;
      border: none;
      background: #1c1c1c;
      display: block;
    }

    /* кнопка снизу для быстрого применения (опционально) */
    .action-bar {
      background: #222;
      padding: 6px 20px;
      border-top: 1px solid #333;
      display: flex;
      gap: 16px;
      flex-shrink: 0;
      align-items: center;
    }
    .action-bar button {
      background: #3a5a7a;
      border: none;
      color: white;
      padding: 4px 18px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .action-bar button:hover {
      background: #4a7a9a;
      transform: scale(1.02);
    }
    .action-bar .hint {
      color: #777;
      font-size: 12px;
    }

    /* адаптив — на узких экранах стек */
    @media (max-width: 720px) {
      .split-container {
        flex-direction: column;
      }
      .code-panel {
        border-right: none;
        border-bottom: 2px solid #333;
        flex: 1 1 50%;
        min-height: 40vh;
      }
      .preview-panel {
        flex: 1 1 50%;
        min-height: 40vh;
      }
    }

    /* скролл для редактора */
    #codeEditor::-webkit-scrollbar {
      width: 8px;
      background: #1e1e1e;
    }
    #codeEditor::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 6px;
    }
    #codeEditor::-webkit-scrollbar-thumb:hover {
      background: #5a5a5a;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span>🧩 ImGui · интерактивный редактор</span>
    <span>⚡ C++ · реальное время</span>
  </div>

  <div class="split-container">
    <!-- левая часть: редактор -->
    <div class="code-panel">
      <div class="header">
        <span>📄 <strong>код дизайна</strong> (ImGui C++)</span>
        <span class="lang">C++</span>
      </div>
      <textarea id="codeEditor" spellcheck="false" autofocus>// === Пример меню ImGui (C++) ===
// Изменяй — справа сразу видно!

ImGui::Begin("Меню", nullptr, ImGuiWindowFlags_None);

if (ImGui::BeginTabBar("MainTabs")) {
    if (ImGui::BeginTabItem("Настройки")) {
        ImGui::Text("Параметры окна");
        static float val = 0.5f;
        ImGui::SliderFloat("Прозрачность", &val, 0.0f, 1.0f);
        ImGui::Checkbox("Включить тень", &static_cast<bool&>(true));
        ImGui::EndTabItem();
    }
    if (ImGui::BeginTabItem("Эффекты")) {
        ImGui::Text("Эффекты пост-обработки");
        static int effect = 0;
        ImGui::RadioButton("None", &effect, 0);
        ImGui::RadioButton("Blur", &effect, 1);
        ImGui::RadioButton("Glow", &effect, 2);
        ImGui::EndTabItem();
    }
    if (ImGui::BeginTabItem("Инфо")) {
        ImGui::Text("ImGui версия: 1.90");
        ImGui::Text("C++ код обновляется live");
        if (ImGui::Button("Применить")) {
            // симуляция действия
        }
        ImGui::EndTabItem();
    }
    ImGui::EndTabBar();
}

ImGui::End();</textarea>
    </div>

    <!-- правая часть: превью ImGui -->
    <div class="preview-panel">
      <div class="header">
        <span>🖥️ <strong>предпросмотр</strong> (ImGui)</span>
        <span class="status">● живой рендеринг</span>
      </div>
      <iframe id="previewFrame"></iframe>
    </div>
  </div>

  <div class="action-bar">
    <button id="applyCodeBtn">⟳ Применить код</button>
    <span class="hint">(изменяй код слева — превью обновится)</span>
    <span style="margin-left:auto; color:#666; font-size:12px;">⚡ GitHub Pages ready</span>
  </div>

  <script>
    (function() {
      const editor = document.getElementById('codeEditor');
      const previewFrame = document.getElementById('previewFrame');
      let debounceTimer = null;

      // Экранирование спецсимволов HTML для предотвращения инъекций и ошибок
      function escapeHtml(str) {
        return str.replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
      }

      function generatePreviewFromCode(code) {
        let titleName = "⚙️ Меню";
        const titleMatch = code.match(/ImGui::Begin\s*\(\s*["']([^"']+)["']/);
        if (titleMatch) {
          titleName = escapeHtml(titleMatch[1]);
        }

        let html = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <style>
            body { margin:0; background:#1c1c1c; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:system-ui, sans-serif; padding:16px; box-sizing:border-box; }
            .imgui-window { background:#2a2a2a; border-radius:12px; padding:20px 24px; min-width:300px; max-width:92%; box-shadow:0 12px 40px rgba(0,0,0,0.7); border:1px solid #4a4a4a; color:#ddd; width:fit-content; margin:auto; }
            .imgui-window h2 { margin:0 0 8px 0; font-weight:400; font-size:20px; color:#eee; border-bottom:1px solid #3a3a3a; padding-bottom:6px; }
            .imgui-tab-bar { display:flex; gap:4px; margin:8px 0 12px 0; border-bottom:1px solid #3a3a3a; flex-wrap:wrap; }
            .imgui-tab { padding:4px 14px; border-radius:6px 6px 0 0; background:#333; color:#aaa; cursor:default; border:1px solid #3a3a3a; border-bottom:none; font-size:14px; }
            .imgui-tab.active { background:#3a5a7a; color:#fff; border-color:#4a7a9a; }
            .imgui-content { padding:4px 0; }
            .imgui-text { margin:6px 0; }
            .imgui-slider { display:flex; align-items:center; gap:10px; margin:8px 0; }
            .imgui-slider input { width:140px; background:#3a3a3a; height:4px; border-radius:4px; accent-color:#6a9acf; }
            .imgui-slider span { min-width:40px; color:#ccc; font-size:14px; }
            .imgui-check { display:flex; align-items:center; gap:6px; margin:4px 0; }
            .imgui-check input { accent-color:#6a9acf; width:16px; height:16px; }
            .imgui-radio-group { margin:6px 0; display:flex; gap:12px; flex-wrap:wrap; }
            .imgui-radio-group label { display:flex; align-items:center; gap:4px; font-size:14px; }
            .imgui-btn { background:#3a5a7a; border:none; color:white; padding:4px 18px; border-radius:20px; margin-top:8px; cursor:default; font-size:14px; }
            .imgui-btn:hover { background:#4a7a9a; }
            .imgui-footer { margin-top:12px; font-size:12px; color:#666; border-top:1px solid #2a2a2a; padding-top:8px; text-align:center; }
          </style>
        </head>
        <body>
          <div class="imgui-window">
            <h2>${titleName}</h2>
        `;

        const lines = code.split('\n');
        let tabItems = [];
        let contentHtml = '';

        for (let line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('//')) continue;

          if (trimmed.includes('BeginTabItem')) {
            const match = trimmed.match(/BeginTabItem\s*\(\s*["']([^"']+)["']/);
            if (match && !tabItems.includes(match[1])) {
              tabItems.push(escapeHtml(match[1]));
            }
            continue;
          }

          if (trimmed.includes('ImGui::Text')) {
            const match = trimmed.match(/Text\s*\(\s*["']([^"']+)["']/);
            if (match) {
              contentHtml += `<div class="imgui-text">${escapeHtml(match[1])}</div>`;
            }
            continue;
          }

          if (trimmed.includes('ImGui::SliderFloat')) {
            const match = trimmed.match(/SliderFloat\s*\(\s*["']([^"']+)["']/);
            if (match) {
              contentHtml += `
                <div class="imgui-slider">
                  <span>${escapeHtml(match[1])}</span>
                  <input type="range" min="0" max="1" step="0.01" value="0.5">
                  <span>0.50</span>
                </div>
              `;
            }
            continue;
          }

          if (trimmed.includes('ImGui::Checkbox')) {
            const match = trimmed.match(/Checkbox\s*\(\s*["']([^"']+)["']/);
            if (match) {
              contentHtml += `
                <div class="imgui-check">
                  <input type="checkbox" checked> <span>${escapeHtml(match[1])}</span>
                </div>
              `;
            }
            continue;
          }

          if (trimmed.includes('ImGui::RadioButton')) {
            const match = trimmed.match(/RadioButton\s*\(\s*["']([^"']+)["']/);
            if (match) {
              contentHtml += `
                <div class="imgui-radio-group">
                  <label><input type="radio" name="effect" checked> ${escapeHtml(match[1])}</label>
                </div>
              `;
            }
            continue;
          }

          if (trimmed.includes('ImGui::Button')) {
            const match = trimmed.match(/Button\s*\(\s*["']([^"']+)["']/);
            if (match) {
              contentHtml += `<button class="imgui-btn">${escapeHtml(match[1])}</button>`;
            }
            continue;
          }
        }

        if (tabItems.length > 0) {
          html += `<div class="imgui-tab-bar">`;
          for (let i = 0; i < tabItems.length; i++) {
            const cls = (i === 0) ? 'imgui-tab active' : 'imgui-tab';
            html += `<div class="${cls}">${tabItems[i]}</div>`;
          }
          html += `</div>`;
        }

        if (contentHtml) {
          html += `<div class="imgui-content">${contentHtml}</div>`;
        }

        html += `
            <div class="imgui-footer">ImGui 1.90 · C++ live</div>
          </div>
        </body>
        </html>
        `;

        return html;
      }

      function updatePreview() {
        const code = editor.value;
        const previewHtml = generatePreviewFromCode(code);
        
        // Безопасное обновление документа iframe без пересоздания srcdoc
        const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
        doc.open();
        doc.write(previewHtml);
        doc.close();
      }

      // Слушатель с дебаунсом 300мс
      editor.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(updatePreview, 300);
      });

      document.getElementById('applyCodeBtn').addEventListener('click', updatePreview);

      // Инициализация после загрузки страницы
      window.addEventListener('DOMContentLoaded', updatePreview);
    })();
  </script>
</body>
</html>
