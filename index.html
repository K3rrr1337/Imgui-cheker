<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ImGui Style Live Editor · C++</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #121214;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      background: #1a1a1e;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a30;
      flex-shrink: 0;
      font-size: 14px;
    }
    .toolbar span:first-child {
      color: #aaa;
    }
    .toolbar span:last-child {
      background: #252530;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #4a9eff;
      border: 1px solid #353545;
    }

    .split-container {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .code-panel {
      flex: 1 1 50%;
      background: #16161a;
      border-right: 2px solid #25252b;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-panel .header, .preview-panel .header {
      background: #1d1d24;
      padding: 8px 16px;
      border-bottom: 1px solid #2a2a32;
      font-size: 13px;
      color: #ccc;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    
    .code-panel .header .lang {
      background: #2a2a38;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
      color: #4a9eff;
    }

    #codeEditor {
      flex: 1;
      width: 100%;
      background: #16161a;
      color: #d4d4d4;
      border: none;
      outline: none;
      resize: none;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      tab-size: 4;
      white-space: pre;
      overflow-y: auto;
    }

    .preview-panel {
      flex: 1 1 50%;
      background: #0d0d0f;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-panel .header .status {
      color: #4caf50;
      font-size: 12px;
    }

    #previewFrame {
      flex: 1;
      width: 100%;
      border: none;
      background: #0d0d0f;
      display: block;
    }

    .action-bar {
      background: #16161a;
      padding: 8px 20px;
      border-top: 1px solid #25252b;
      display: flex;
      gap: 16px;
      flex-shrink: 0;
      align-items: center;
    }
    .action-bar button {
      background: #2b5278;
      border: none;
      color: white;
      padding: 6px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .action-bar button:hover {
      background: #366796;
    }
    .action-bar .hint {
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .split-container {
        flex-direction: column;
      }
      .code-panel, .preview-panel {
        flex: 1 1 50%;
        min-height: 40vh;
      }
      .code-panel {
        border-right: none;
        border-bottom: 2px solid #25252b;
      }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span>🎨 Dear ImGui · Live Style Editor</span>
    <span>⚡ C++ Style & Palette Editor</span>
  </div>

  <div class="split-container">
    <div class="code-panel">
      <div class="header">
        <span>📄 <strong>C++ Функция Стилей</strong> (ImGuiStyle)</span>
        <span class="lang">C++</span>
      </div>
      <textarea id="codeEditor" spellcheck="false" autofocus>static void StyleDarkBlue() {
    ImGuiStyle &style = ImGui::GetStyle();

    // === Скругления углов ===
    style.WindowRounding = 8.0f;
    style.ChildRounding = 6.0f;
    style.FrameRounding = 4.0f;
    style.PopupRounding = 6.0f;
    style.ScrollbarRounding = 4.0f;
    style.GrabRounding = 4.0f;
    style.TabRounding = 4.0f;

    // === Размеры и отступы ===
    style.WindowPadding = ImVec2(12, 12);
    style.FramePadding = ImVec2(8, 5);
    style.ItemSpacing = ImVec2(8, 8);
    style.ItemInnerSpacing = ImVec2(6, 4);
    style.WindowBorderSize = 1.0f;
    style.FrameBorderSize = 0.0f;

    // === Черно-синяя палитра (Colors) ===
    ImVec4* colors = style.Colors;

    colors[ImGuiCol_Text]                  = ImVec4(0.95f, 0.96f, 0.98f, 1.00f);
    colors[ImGuiCol_TextDisabled]          = ImVec4(0.50f, 0.55f, 0.60f, 1.00f);
    colors[ImGuiCol_WindowBg]              = ImVec4(0.09f, 0.10f, 0.12f, 0.98f);
    colors[ImGuiCol_ChildBg]               = ImVec4(0.12f, 0.13f, 0.16f, 0.60f);
    colors[ImGuiCol_PopupBg]               = ImVec4(0.10f, 0.11f, 0.13f, 0.98f);
    colors[ImGuiCol_Border]                = ImVec4(0.20f, 0.25f, 0.35f, 0.60f);
    
    // Заголовки (Headers)
    colors[ImGuiCol_Header]                = ImVec4(0.16f, 0.26f, 0.42f, 0.85f);
    colors[ImGuiCol_HeaderHovered]         = ImVec4(0.22f, 0.38f, 0.62f, 0.90f);
    colors[ImGuiCol_HeaderActive]          = ImVec4(0.14f, 0.45f, 0.80f, 1.00f);

    // Фреймы (Поля ввода, чекбоксы)
    colors[ImGuiCol_FrameBg]               = ImVec4(0.14f, 0.16f, 0.21f, 1.00f);
    colors[ImGuiCol_FrameBgHovered]        = ImVec4(0.19f, 0.23f, 0.32f, 1.00f);
    colors[ImGuiCol_FrameBgActive]         = ImVec4(0.16f, 0.28f, 0.45f, 1.00f);

    // Кнопки
    colors[ImGuiCol_Button]                = ImVec4(0.16f, 0.29f, 0.48f, 1.00f);
    colors[ImGuiCol_ButtonHovered]         = ImVec4(0.22f, 0.40f, 0.66f, 1.00f);
    colors[ImGuiCol_ButtonActive]          = ImVec4(0.14f, 0.48f, 0.85f, 1.00f);

    // Вкладки (Tabs)
    colors[ImGuiCol_Tab]                   = ImVec4(0.12f, 0.15f, 0.22f, 1.00f);
    colors[ImGuiCol_TabHovered]            = ImVec4(0.22f, 0.40f, 0.66f, 1.00f);
    colors[ImGuiCol_TabActive]             = ImVec4(0.18f, 0.34f, 0.56f, 1.00f);

    // Ползунки
    colors[ImGuiCol_SliderGrab]            = ImVec4(0.24f, 0.52f, 0.88f, 1.00f);
    colors[ImGuiCol_SliderGrabActive]      = ImVec4(0.30f, 0.60f, 1.00f, 1.00f);
    
    // Заголовок окна
    colors[ImGuiCol_TitleBg]               = ImVec4(0.08f, 0.09f, 0.11f, 1.00f);
    colors[ImGuiCol_TitleBgActive]         = ImVec4(0.12f, 0.20f, 0.35f, 1.00f);
}</textarea>
    </div>

    <div class="preview-panel">
      <div class="header">
        <span>🖥️ <strong>Предпросмотр темы</strong></span>
        <span class="status">● рендеринг в реальном времени</span>
      </div>
      <iframe id="previewFrame"></iframe>
    </div>
  </div>

  <div class="action-bar">
    <button id="applyCodeBtn">⟳ Применить стиль</button>
    <span class="hint">Изменения в `style.*` и `colors[...]` обновляются без перезагрузки фрейма</span>
  </div>

  <script>
    (function() {
      const editor = document.getElementById('codeEditor');
      const previewFrame = document.getElementById('previewFrame');
      let debounceTimer = null;

      const baseFrameHTML = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style id="dynamicStyles"></style>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      background: #09090b; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
      color: var(--col-Text, #fff);
    }

    .imgui-window {
      background: var(--col-WindowBg, #17191e);
      border-radius: var(--WindowRounding, 8px);
      border: var(--WindowBorderSize, 1px) solid var(--col-Border, transparent);
      padding: var(--WindowPadding-Y, 12px) var(--WindowPadding-X, 12px);
      width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      font-size: 13px;
    }

    .imgui-titlebar {
      background: var(--col-TitleBgActive, #1e3359);
      margin: calc(-1 * var(--WindowPadding-Y, 12px)) calc(-1 * var(--WindowPadding-X, 12px)) var(--WindowPadding-Y, 12px) calc(-1 * var(--WindowPadding-X, 12px));
      padding: 6px 12px;
      border-top-left-radius: var(--WindowRounding, 8px);
      border-top-right-radius: var(--WindowRounding, 8px);
      font-weight: 600;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--col-Border, transparent);
    }

    .imgui-child {
      background: var(--col-ChildBg, rgba(30, 33, 40, 0.6));
      border-radius: var(--ChildRounding, 6px);
      border: 1px solid var(--col-Border, transparent);
      padding: 10px;
      margin-bottom: var(--ItemSpacing-Y, 8px);
    }

    .imgui-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: var(--ItemSpacing-Y, 8px);
      border-bottom: 1px solid var(--col-Border, #333);
    }

    .imgui-tab {
      background: var(--col-Tab, #1e2638);
      padding: var(--FramePadding-Y, 5px) var(--FramePadding-X, 8px);
      border-top-left-radius: var(--TabRounding, 4px);
      border-top-right-radius: var(--TabRounding, 4px);
      color: var(--col-TextDisabled, #808c99);
      font-size: 12px;
    }
    
    .imgui-tab.active {
      background: var(--col-TabActive, #2e568f);
      color: var(--col-Text, #fff);
    }

    .imgui-item {
      margin-bottom: var(--ItemSpacing-Y, 8px);
    }

    .imgui-input {
      background: var(--col-FrameBg, #232835);
      border-radius: var(--FrameRounding, 4px);
      border: var(--FrameBorderSize, 0px) solid var(--col-Border, transparent);
      padding: var(--FramePadding-Y, 5px) var(--FramePadding-X, 8px);
      color: var(--col-Text, #fff);
      width: 100%;
      outline: none;
    }

    .imgui-slider-container {
      display: flex;
      align-items: center;
      gap: var(--ItemInnerSpacing-X, 6px);
    }

    .imgui-slider-track {
      flex: 1;
      height: 12px;
      background: var(--col-FrameBg, #232835);
      border-radius: var(--FrameRounding, 4px);
      position: relative;
    }

    .imgui-slider-grab {
      width: 16px;
      height: 100%;
      background: var(--col-SliderGrab, #3dd5e0);
      border-radius: var(--GrabRounding, 4px);
      position: absolute;
      left: 40%;
    }

    .imgui-btn {
      background: var(--col-Button, #284a7a);
      border-radius: var(--FrameRounding, 4px);
      padding: var(--FramePadding-Y, 5px) var(--FramePadding-X, 8px);
      color: var(--col-Text, #fff);
      border: none;
      font-size: 12px;
      cursor: pointer;
    }

    .imgui-checkbox {
      display: flex;
      align-items: center;
      gap: var(--ItemInnerSpacing-X, 6px);
    }

    .imgui-check-box {
      width: 14px;
      height: 14px;
      background: var(--col-FrameBg, #232835);
      border-radius: var(--FrameRounding, 4px);
      position: relative;
    }
    .imgui-check-box.checked::after {
      content: '';
      position: absolute;
      left: 4px; top: 1px;
      width: 3px; height: 7px;
      border: solid var(--col-Text, #fff);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <div class="imgui-window">
    <div class="imgui-titlebar">
      <span>Пример меню (ImGui Theme)</span>
      <span style="color:var(--col-TextDisabled, #666)">✕</span>
    </div>

    <div class="imgui-tabs">
      <div class="imgui-tab active">Аимбот</div>
      <div class="imgui-tab">Валхак</div>
      <div class="imgui-tab">Настройки</div>
    </div>

    <div class="imgui-child">
      <div class="imgui-item imgui-checkbox">
        <div class="imgui-check-box checked"></div>
        <span>Включить Aimbot</span>
      </div>
      <div class="imgui-item imgui-slider-container">
        <span style="width:70px;">FOV:</span>
        <div class="imgui-slider-track">
          <div class="imgui-slider-grab"></div>
        </div>
      </div>
    </div>

    <div class="imgui-item">
      <input type="text" class="imgui-input" value="Бинд клавиши: MOUSE5" readonly />
    </div>

    <div style="display:flex; justify-content:space-between; margin-top:12px;">
      <button class="imgui-btn">Сохранить</button>
      <button class="imgui-btn" style="background:var(--col-Header, #28426b)">Сброс</button>
    </div>
  </div>
</body>
</html>`;

      function parseCppToCSS(code) {
        let cssVars = ':root {\n';
        const lines = code.split('\n');

        lines.forEach(line => {
          const floatMatch = line.match(/style\.([A-Za-z0-9_]+)\s*=\s*([0-9.]+)/);
          if (floatMatch) {
            cssVars += `  --${floatMatch[1]}: ${floatMatch[2]}px;\n`;
          }

          const vec2Match = line.match(/style\.([A-Za-z0-9_]+)\s*=\s*ImVec2\s*\(\s*([0-9.]+)\s*,\s*([0-9.]+)\s*\)/);
          if (vec2Match) {
            cssVars += `  --${vec2Match[1]}-X: ${vec2Match[2]}px;\n`;
            cssVars += `  --${vec2Match[1]}-Y: ${vec2Match[3]}px;\n`;
          }

          const colMatch = line.match(/colors\s*\[\s*ImGuiCol_([A-Za-z0-9_]+)\s*\]\s*=\s*ImVec4\s*\(\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*\)/);
          if (colMatch) {
            const name = colMatch[1];
            const r = Math.round(Math.min(1, Math.max(0, parseFloat(colMatch[2]))) * 255);
            const g = Math.round(Math.min(1, Math.max(0, parseFloat(colMatch[3]))) * 255);
            const b = Math.round(Math.min(1, Math.max(0, parseFloat(colMatch[4]))) * 255);
            const a = Math.min(1, Math.max(0, parseFloat(colMatch[5])));
            cssVars += `  --col-${name}: rgba(${r}, ${g}, ${b}, ${a});\n`;
          }
        });

        cssVars += '}';
        return cssVars;
      }

      function updateTheme() {
        const frameDoc = previewFrame.contentDocument || (previewFrame.contentWindow && previewFrame.contentWindow.document);
        if (!frameDoc) return;

        const styleElement = frameDoc.getElementById('dynamicStyles');
        if (styleElement) {
          styleElement.textContent = parseCppToCSS(editor.value);
        }
      }

      function initIframe() {
        previewFrame.srcdoc = baseFrameHTML;
        previewFrame.addEventListener('load', updateTheme, { once: true });
      }

      editor.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(updateTheme, 150);
      });

      document.getElementById('applyCodeBtn').addEventListener('click', updateTheme);

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initIframe);
      } else {
        initIframe();
      }
    })();
  </script>
</body>
</html>
