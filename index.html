<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IMGUI Редактор / Превью</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1e1e2f;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
        }

        /* ===== Верхняя панель ===== */
        .toolbar {
            background: #2d2d44;
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #3f3f5a;
            min-height: 52px;
            flex-shrink: 0;
        }

        .toolbar .title {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.3px;
            color: #c0c0e0;
            margin-right: 12px;
        }

        .toolbar .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .toolbar button {
            background: #3b3b58;
            border: 1px solid #4f4f6e;
            color: #f0f0ff;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar button:hover {
            background: #4f4f72;
            border-color: #7a7a9e;
            transform: scale(0.97);
        }

        .toolbar button:active {
            background: #5f5f82;
        }

        .toolbar input[type="file"] {
            display: none;
        }

        .status-badge {
            margin-left: auto;
            font-size: 0.75rem;
            background: #2a2a3e;
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid #4a4a66;
            color: #aab;
        }

        /* ===== Основной контейнер ===== */
        .split-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 52px);
            overflow: hidden;
        }

        /* ===== Левая панель ===== */
        .editor-panel {
            flex: 1 1 50%;
            background: #1a1a2a;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #33334a;
            min-width: 280px;
            overflow: hidden;
        }

        .editor-panel .panel-header, .preview-panel .panel-header {
            background: #25253b;
            padding: 8px 16px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8a8aaa;
            border-bottom: 1px solid #33334a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .editor-panel .panel-header span:last-child, .preview-panel .panel-header span:last-child {
            font-size: 0.7rem;
            background: #2e2e48;
            padding: 2px 10px;
            border-radius: 20px;
        }

        .editor-panel textarea {
            flex: 1;
            width: 100%;
            padding: 16px;
            background: #11111f;
            color: #d4d4f0;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
            font-size: 14px;
            line-height: 1.7;
            tab-size: 4;
            white-space: pre;
            overflow: auto;
            box-shadow: inset 0 0 0 1px #282840;
        }

        .editor-panel textarea:focus {
            box-shadow: inset 0 0 0 2px #5f5f9f;
            background: #141425;
        }

        /* ===== Правая панель ===== */
        .preview-panel {
            flex: 1 1 50%;
            background: #1c1c30;
            display: flex;
            flex-direction: column;
            min-width: 280px;
        }

        .preview-frame-wrapper {
            flex: 1;
            background: #131325;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        #preview-iframe {
            width: 100%;
            height: 100%;
            background: #0f0f1f;
            border: 1px solid #3a3a5a;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            min-height: 300px;
            min-width: 200px;
        }

        @media (max-width: 720px) {
            .split-container {
                flex-direction: column;
            }
            .editor-panel {
                border-right: none;
                border-bottom: 2px solid #33334a;
            }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <span class="title">🧩 IMGUI Studio</span>
        <div class="btn-group">
            <button id="loadBtn" title="Загрузить код из файла">📂 Загрузить</button>
            <button id="saveBtn" title="Скачать текущий код">💾 Выгрузить</button>
            <button id="applyBtn" title="Обновить превью (Ctrl+Enter)">▶ Применить</button>
            <input type="file" id="fileInput" accept=".html,.htm,.txt,.js,.css,.lua,.cpp">
        </div>
        <span class="status-badge" id="statusBadge">⚡ готово</span>
    </div>

    <div class="split-container">
        <div class="editor-panel">
            <div class="panel-header">
                <span>📝 РЕДАКТОР КОДА</span>
                <span id="charCount">0 симв.</span>
            </div>
            <textarea id="codeEditor" spellcheck="false" placeholder="Вставьте или напишите ваш код…"><div style="background: #2a2a4a; padding: 20px; border-radius: 16px; color: #eee; font-family: sans-serif;">
    <h2 style="color: #b0b0ff;">Привет, IMGUI!</h2>
    <p style="background: #1f1f3a; padding: 12px; border-radius: 8px;">
        Это пример интерфейса. Замените код на свой.
    </p>
    <button style="background: #6c6cff; border: none; padding: 10px 20px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;">Нажми меня</button>
</div></textarea>
        </div>

        <div class="preview-panel">
            <div class="panel-header">
                <span>🖥️ ПРЕВЬЮ</span>
                <span id="previewStatus">live</span>
            </div>
            <div class="preview-frame-wrapper">
                <iframe id="preview-iframe" sandbox="allow-scripts allow-modals allow-forms"></iframe>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const editor = document.getElementById('codeEditor');
            const iframe = document.getElementById('preview-iframe');
            const statusBadge = document.getElementById('statusBadge');
            const charCount = document.getElementById('charCount');
            const previewStatus = document.getElementById('previewStatus');

            const fileInput = document.getElementById('fileInput');
            const loadBtn = document.getElementById('loadBtn');
            const saveBtn = document.getElementById('saveBtn');
            const applyBtn = document.getElementById('applyBtn');

            let liveTimeout;

            function renderPreview() {
                const code = editor.value;
                const doc = iframe.contentDocument || iframe.contentWindow.document;

                let fullHtml = code;
                const trimmed = code.trim();

                if (!/<!DOCTYPE/i.test(trimmed) && !/<html/i.test(trimmed)) {
                    fullHtml = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Preview</title>
    <style>
        body { margin: 0; padding: 16px; background: #12121f; color: #e0e0f0; font-family: system-ui, sans-serif; }
    </style>
</head>
<body>
${code}
</body>
</html>`;
                }

                doc.open();
                doc.write(fullHtml);
                doc.close();

                statusBadge.textContent = '✅ обновлено';
                previewStatus.textContent = '🔄 обновлено';
                setTimeout(() => {
                    statusBadge.textContent = '⚡ готово';
                    previewStatus.textContent = 'live';
                }, 1200);

                charCount.textContent = code.length + ' симв.';
            }

            function loadFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    editor.value = e.target.result;
                    renderPreview();
                    statusBadge.textContent = '📂 загружено';
                    setTimeout(() => statusBadge.textContent = '⚡ готово', 1500);
                };
                reader.readAsText(file);
            }

            function downloadCode() {
                const code = editor.value;
                if (!code.trim()) return;
                const blob = new Blob([code], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'imgui_design.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // Кнопка и комбинация Ctrl+Enter
            applyBtn.addEventListener('click', renderPreview);
            editor.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    renderPreview();
                }
            });

            // Авто-обновление во время печати (с паузой 600мс)
            editor.addEventListener('input', function() {
                charCount.textContent = this.value.length + ' симв.';
                clearTimeout(liveTimeout);
                liveTimeout = setTimeout(renderPreview, 600);
            });

            // Загрузка / Выгрузка
            loadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', function() {
                if (this.files && this.files[0]) loadFile(this.files[0]);
                this.value = '';
            });
            saveBtn.addEventListener('click', downloadCode);

            // Drag & Drop файла в область редактора
            window.addEventListener('dragover', e => e.preventDefault());
            window.addEventListener('drop', e => {
                e.preventDefault();
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    loadFile(e.dataTransfer.files[0]);
                }
            });

            window.addEventListener('load', renderPreview);
        })();
    </script>
</body>
</html>
