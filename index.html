<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImGui Visual Studio & Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d14;
            color: #c0c0d0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== Шапка страницы ===== */
        .toolbar {
            background: #181824;
            height: 45px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a3d;
            flex-shrink: 0;
        }

        .toolbar .title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #4a9eff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar .actions {
            display: flex;
            gap: 10px;
        }

        .toolbar button {
            background: #252538;
            border: 1px solid #3d3d5c;
            color: #d0d0e0;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .toolbar button:hover {
            background: #32324e;
            border-color: #565680;
            color: #ffffff;
        }

        /* ===== Двухколоночный макет ===== */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 45px);
            overflow: hidden;
        }

        /* ===== ЛЕВАЯ СТОРОНА: Редактор кода ===== */
        .editor-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #12121c;
            border-right: 2px solid #202030;
            min-width: 300px;
        }

        .panel-header {
            background: #181826;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #707090;
            border-bottom: 1px solid #202030;
            display: flex;
            justify-content: space-between;
        }

        #code-editor {
            flex: 1;
            width: 100%;
            background: #0e0e17;
            color: #a9b7c6;
            border: none;
            outline: none;
            padding: 16px;
            font-family: 'Consolas', 'Fira Code', 'Monaco', monospace;
            font-size: 13.5px;
            line-height: 1.6;
            resize: none;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
        }

        /* ===== ПРАВАЯ СТОРОНА: Превью с ImGui Окном ===== */
        .preview-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #161622;
            min-width: 300px;
        }

        .preview-viewport {
            flex: 1;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(#202035 1px, transparent 1px);
            background-size: 20px 20px;
            overflow: auto;
        }

        /* Имитация окна Dear ImGui */
        .imgui-window {
            width: 440px;
            min-height: 320px;
            background: rgba(15, 16, 21, 0.95);
            border: 1px solid #363946;
            border-radius: 4px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка ImGui окна */
        .imgui-titlebar {
            background: #1c1e24;
            padding: 6px 10px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #e0e0e0;
            border-bottom: 1px solid #2a2d37;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .imgui-titlebar .controls {
            display: flex;
            gap: 6px;
        }

        .imgui-titlebar .btn-min {
            width: 10px;
            height: 10px;
            background: #4a4d5a;
            border-radius: 2px;
        }

        /* Поле контента ImGui, куда накладывается пользовательский код */
        #imgui-content {
            padding: 14px;
            flex: 1;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 13px;
            overflow-y: auto;
        }

        /* Адаптивность для мобильных экранов */
        @media (max-width: 768px) {
            .workspace {
                flex-direction: column;
            }
            .editor-side, .preview-side {
                flex: 1;
                min-width: 100%;
            }
            .editor-side {
                border-right: none;
                border-bottom: 2px solid #202030;
            }
        }
    </style>
</head>
<body>

    <!-- Верхняя панель -->
    <div class="toolbar">
        <div class="title">
            <span>⚙️ ImGui Menu Designer</span>
        </div>
        <div class="actions">
            <button id="resetBtn">🔄 Сбросить пример</button>
            <button id="copyBtn">📋 Скопировать код</button>
        </div>
    </div>

    <!-- Основная рабочая область -->
    <div class="workspace">

        <!-- ЛЕВАЯ ПАНЕЛЬ: Текстовый редактор -->
        <div class="editor-side">
            <div class="panel-header">
                <span>Код дизайна (HTML / CSS)</span>
                <span id="char-counter">0 символов</span>
            </div>
            <textarea id="code-editor" spellcheck="false" placeholder="Вставьте ваш HTML/CSS код для макета..."></textarea>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ: Превью с наложенным ImGui -->
        <div class="preview-side">
            <div class="panel-header">
                <span>Интерактивное превью</span>
                <span>Live Render</span>
            </div>
            <div class="preview-viewport">
                
                <!-- Окно ImGui -->
                <div class="imgui-window">
                    <div class="imgui-titlebar">
                        <span>Cheat Menu v1.0 [ImGui]</span>
                        <div class="controls">
                            <div class="btn-min"></div>
                        </div>
                    </div>
                    
                    <!-- Сюда динамически подгружается ваш код -->
                    <div id="imgui-content"></div>
                </div>

            </div>
        </div>

    </div>

    <script>
        (function() {
            const editor = document.getElementById('code-editor');
            const preview = document.getElementById('imgui-content');
            const charCounter = document.getElementById('char-counter');
            const resetBtn = document.getElementById('resetBtn');
            const copyBtn = document.getElementById('copyBtn');

            // Начальный пример ImGui элементов (кнопки, чекбоксы, слайдеры, вкладки)
            const defaultCode = `<style>
    /* Стили элементов в стиле Dear ImGui */
    .imgui-group { margin-bottom: 12px; }
    .imgui-label { font-size: 11px; color: #8a8a9e; margin-bottom: 4px; text-transform: uppercase; }
    
    .imgui-btn {
        background: #24497a;
        border: 1px solid #3668a8;
        color: #ffffff;
        padding: 6px 14px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
        transition: 0.1s;
    }
    .imgui-btn:hover { background: #315d9b; }
    .imgui-btn:active { background: #1a3559; }

    .imgui-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        cursor: pointer;
        user-select: none;
    }
    .imgui-checkbox input { accent-color: #3668a8; }

    .imgui-slider {
        width: 100%;
        accent-color: #3668a8;
        margin-top: 4px;
    }
</style>

<div class="imgui-group">
    <div class="imgui-label">Основные функции</div>
    <label class="imgui-checkbox">
        <input type="checkbox" checked> Enable ESP (Обводка игроков)
    </label>
    <label class="imgui-checkbox">
        <input type="checkbox"> Aimbot (Аимасист)
    </label>
</div>

<div class="imgui-group">
    <div class="imgui-label">Дистанция работы: 150m</div>
    <input type="range" class="imgui-slider" min="0" max="500" value="150">
</div>

<div class="imgui-group" style="margin-top: 15px;">
    <button class="imgui-btn">Применить настройки</button>
</div>`;

            // Функция обновления превью
            function updatePreview() {
                const code = editor.value;
                preview.innerHTML = code;
                charCounter.textContent = code.length + ' символов';
            }

            // Слушатель событий ввода в редакторе
            editor.addEventListener('input', updatePreview);

            // Кнопка сброса к начальному коду
            resetBtn.addEventListener('click', () => {
                editor.value = defaultCode;
                updatePreview();
            });

            // Кнопка копирования кода
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(editor.value).then(() => {
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '✅ Скопировано!';
                    setTimeout(() => copyBtn.textContent = originalText, 1500);
                });
            });

            // Установка дефолтного кода при первой загрузке
            editor.value = defaultCode;
            updatePreview();
        })();
    </script>
</body>
</html>
