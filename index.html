<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ImGui Style Live Editor · C++</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #121214;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      background: #1a1a1e;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a30;
      flex-shrink: 0;
      font-size: 14px;
    }
    .toolbar span:first-child {
      color: #aaa;
    }
    .toolbar span:last-child {
      background: #252530;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #4a9eff;
      border: 1px solid #353545;
    }

    .split-container {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .code-panel {
      flex: 1 1 50%;
      background: #16161a;
      border-right: 2px solid #25252b;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .code-panel .header, .preview-panel .header {
      background: #1d1d24;
      padding: 8px 16px;
      border-bottom: 1px solid #2a2a32;
      font-size: 13px;
      color: #ccc;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
    
    .code-panel .header .lang {
      background: #2a2a38;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
      color: #4a9eff;
    }

    #codeEditor {
      flex: 1;
      width: 100%;
      background: #16161a;
      color: #d4d4d4;
      border: none;
      outline: none;
      resize: none;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      tab-size: 4;
      white-space: pre;
      overflow-y: auto;
    }

    .preview-panel {
      flex: 1 1 50%;
      background: #0d0d0f;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .preview-panel .header .status {
      color: #4caf50;
      font-size: 12px;
    }

    #previewFrame {
      flex: 1;
      width: 100%;
      border: none;
      background: #0d0d0f;
      display: block;
    }

    .action-bar {
      background: #16161a;
      padding: 8px 20px;
      border-top: 1px solid #25252b;
      display: flex;
      gap: 16px;
      flex-shrink: 0;
      align-items: center;
    }
    .action-bar button {
      background: #2b5278;
      border: none;
      color: white;
      padding: 6px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .action-bar button:hover {
      background: #366796;
    }
    .action-bar .hint {
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .split-container {
        flex-direction: column;
      }
      .code-panel, .preview-panel {
        flex: 1 1 50%;
        min-height: 40vh;
      }
      .code-panel {
        border-right: none;
        border-bottom: 2px solid #25252b;
      }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span>🎨 Dear ImGui · Live Style Editor</span>
    <span>⚡ C++ Style & Palette Editor</span>
  </div>

  <div class="split-container">
    <div class="code-panel">
      <div class="header">
        <span>📄 <strong>C++ Функция Стилей</strong> (ImGuiStyle)</span>
        <span class="lang">C++</span>
      </div>
      <textarea id="codeEditor" spellcheck="false" autofocus>static void StyleDarkBlue() {
    ImGuiStyle &style = ImGui::GetStyle();

    // === Скругления углов ===
    style.WindowRounding = 8.0f;
    style.ChildRounding = 6.0f;
    style.FrameRounding = 4.0f;
    style.PopupRounding = 6.0f;
    style.ScrollbarRounding = 4.0f;
    style.GrabRounding = 4.0f;
    style.TabRounding = 4.0f;

    // === Размеры и отступы ===
    style.WindowPadding = ImVec2(12, 12);
    style.FramePadding = ImVec2(8, 5);
    style.ItemSpacing = ImVec2(8, 8);
    style.ItemInnerSpacing = ImVec2(6, 4);
    style.WindowBorderSize = 1.0f;
    style.FrameBorderSize = 0.0f;
    style.ScrollbarSize = 10.0f;

    // === Черно-синяя палитра (Colors) ===
    ImVec4* colors = style.Colors;

    colors[ImGuiCol_Text]                  = ImVec4(0.95f, 0.96f, 0.98f, 1.00f);
    colors[ImGuiCol_TextDisabled]          = ImVec4(0.50f, 0.55f, 0.60f, 1.00f);
    colors[ImGuiCol_WindowBg]              = ImVec4(0.09f, 0.10f, 0.12f, 0.98f);
    colors[ImGuiCol_ChildBg]               = ImVec4(0.12f, 0.13f, 0.16f, 0.60f);
    colors[ImGuiCol_PopupBg]               = ImVec4(0.10f, 0.11f, 0.13f, 0.98f);
    colors[ImGuiCol_Border]                = ImVec4(0.20f, 0.25f, 0.35f, 0.60f);
    
    // Заголовки (Headers)
    colors[ImGuiCol_Header]                = ImVec4(0.16f, 0.26f, 0.42f, 0.85f);
    colors[ImGuiCol_HeaderHovered]         = ImVec4(0.22f, 0.38f, 0.62f, 0.90f);
    colors[ImGuiCol_HeaderActive]          = ImVec4(0.14f, 0.45f, 0.80f, 1.00f);

    // Фреймы (Поля ввода, чекбоксы)
    colors[ImGuiCol_FrameBg]               = ImVec4(0.14f, 0.16f, 0.21f, 1.00f);
    colors[ImGuiCol_FrameBgHovered]        = ImVec4(0.19f, 0.23f, 0.32f, 1.00f);
    colors[ImGuiCol_FrameBgActive]         = ImVec4(0.16f, 0.28f, 0.45f, 1.00f);

    // Кнопки
    colors[ImGuiCol_Button]                = ImVec4(0.16f, 0.29f, 0.48f, 1.00f);
    colors[ImGuiCol_ButtonHovered]         = ImVec4(0.22f, 0.40f, 0.66f, 1.00f);
    colors[ImGuiCol_ButtonActive]          = ImVec4(0.14f, 0.48f, 0.85f, 1.00f);

    // Вкладки (Tabs)
    colors[ImGuiCol_Tab]                   = ImVec4(0.12f, 0.15f, 0.22f, 1.00f);
    colors[ImGuiCol_TabHovered]            = ImVec4(0.22f, 0.40f, 0.66f, 1.00f);
    colors[ImGuiCol_TabActive]             = ImVec4(0.18f, 0.34f, 0.56f, 1.00f);
    colors[ImGuiCol_TabUnfocusedActive]    = ImVec4(0.14f, 0.24f, 0.40f, 1.00f);

    // Скроллбар и Ползунки
    colors[ImGuiCol_ScrollbarBg]           = ImVec4(0.08f, 0.09f, 0.11f, 0.60f);
    colors[ImGuiCol_ScrollbarGrab]         = ImVec4(0.18f, 0.26f, 0.38f, 1.00f);
    colors[ImGuiCol_ScrollbarGrabHovered]  = ImVec4(0.25f, 0.38f, 0.58f, 1.00f);
    colors[ImGuiCol_ScrollbarGrabActive]   = ImVec4(0.20f, 0.50f, 0.85f, 1.00f);
    colors[ImGuiCol_SliderGrab]            = ImVec4(0.24f, 0.52f, 0.88f, 1.00f);
    colors[ImGuiCol_SliderGrabActive]      = ImVec4(0.30f, 0.60f, 1.00f, 1.00f);
    
    // Заголовок окна
    colors[ImGuiCol_TitleBg]               = ImVec4(0.08f, 0.09f, 0.11f, 1.00f);
    colors[ImGuiCol_TitleBgActive]         = ImVec4(0.12f, 0.20f, 0.35f, 1.00f);
}</textarea>
    </div>

    <div class="preview-panel">
      <div class="header">
        <span>🖥️ <strong>Предпросмотр темы</strong></span>
        <span class="status">● рендеринг в реальном времени</span>
      </div>
      <iframe id="previewFrame"></iframe>
    </div>
  </div>

  <div class="action-bar">
    <button id="applyCodeBtn">⟳ Применить стиль</button>
    <span class="hint">Редактируйте переменные `style.*` и `colors[...]` — превью обновится автоматически</span>
  </div>

  <script>
    (function() {
      const editor = document.getElementById('codeEditor');
      const previewFrame = document.getElementById('previewFrame');
      let debounceTimer = null;

      // Базовые значения ImGuiStyle по умолчанию
      function parseStyle(code) {
        const style = {
          WindowRounding: 6,
          ChildRounding: 6,
          FrameRounding: 4,
          PopupRounding: 4,
          ScrollbarRounding: 4,
          GrabRounding: 4,
          TabRounding: 4,

          WindowPadding: [12, 12],
          FramePadding: [8, 5],
          ItemSpacing: [8, 8],
          ItemInnerSpacing: [6, 4],

          WindowBorderSize: 1,
          FrameBorderSize: 0,
          ScrollbarSize: 10,

          colors: {
            Text: 'rgba(242, 245, 250, 1.0)',
            TextDisabled: 'rgba(128, 140, 153, 1.0)',
            WindowBg: 'rgba(23, 25, 30, 0.98)',
            ChildBg: 'rgba(30, 33, 40, 0.60)',
            PopupBg: 'rgba(25, 28, 33, 0.98)',
            Border: 'rgba(50, 64, 90, 0.60)',
            Header: 'rgba(40, 66, 107, 0.85)',
            HeaderHovered: 'rgba(56, 97, 158, 0.90)',
            HeaderActive: 'rgba(35, 115, 204, 1.0)',
            FrameBg: 'rgba(35, 40, 53, 1.0)',
            FrameBgHovered: 'rgba(48, 58, 81, 1.0)',
            FrameBgActive: 'rgba(40, 71, 115, 1.0)',
            Button: 'rgba(40, 74, 122, 1.0)',
            ButtonHovered: 'rgba(56, 102, 168, 1.0)',
            ButtonActive: 'rgba(35, 122, 217, 1.0)',
            Tab: 'rgba(30, 38, 56, 1.0)',
            TabHovered: 'rgba(56, 102, 168, 1.0)',
            TabActive: 'rgba(46, 86, 143, 1.0)',
            ScrollbarBg: 'rgba(20, 23, 28, 0.6)',
            ScrollbarGrab: 'rgba(46, 66, 97, 1.0)',
            ScrollbarGrabHovered: 'rgba(64, 97, 148, 1.0)',
            SliderGrab: 'rgba(61, 133, 224, 1.0)',
            TitleBg: 'rgba(20, 23, 28, 1.0)',
            TitleBgActive: 'rgba(30, 51, 89, 1.0)'
          }
        };

        const lines = code.split('\n');

        // Парсинг floats: style.Property = 10.0f;
        lines.forEach(line => {
          const floatMatch = line.match(/style\.([A-Za-z0-9_]+)\s*=\s*([0-9.]+)\s*f?/);
          if (floatMatch && style.hasOwnProperty(floatMatch[1])) {
            style[floatMatch[1]] = parseFloat(floatMatch[2]);
          }

          // Парсинг ImVec2: style.Property = ImVec2(12, 12);
          const vec2Match = line.match(/style\.([A-Za-z0-9_]+)\s*=\s*ImVec2\s*\(\s*([0-9.]+)\s*,\s*([0-9.]+)\s*\)/);
          if (vec2Match && style.hasOwnProperty(vec2Match[1])) {
            style[vec2Match[1]] = [parseFloat(vec2Match[2]), parseFloat(vec2Match[3])];
          }

          // Парсинг Цветов: colors[ImGuiCol_Name] = ImVec4(r, g, b, a);
          const colMatch = line.match(/colors\s*\[\s*ImGuiCol_([A-Za-z0-9_]+)\s*\]\s*=\s*ImVec4\s*\(\s*([0-9.]+)f?\s*,\s*([0-9.]+)f?\s*,\s*([0-9.]+)f?\s*,\s*([0-9.]+)f?\s*\)/);
          if (colMatch) {
            const name = colMatch[1];
            const r = Math.round(parseFloat(colMatch[2]) * 255);
            const g = Math.round(parseFloat(colMatch[3]) * 255);
            const b = Math.round(parseFloat(colMatch[4]) * 255);
            const a = parseFloat(colMatch[5]);
            style.colors[name] = `rgba(${r}, ${g}, ${b}, ${a})`;
          }
        });

        return style;
      }

      function generatePreview(s) {
        return `
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <style>
            * { box-sizing: border-box; }
            body { 
              margin:0; 
              background:#09090b; 
              display:flex; 
              align-items:center; 
              justify-content:center; 
              min-height:100vh; 
              font-family: system-ui, -apple-system, sans-serif;
              color: ${s.colors.Text || '#fff'};
              padding: 20px;
            }

            .imgui-window {
              background: ${s.colors.WindowBg};
              border-radius: ${s.WindowRounding}px;
              border: ${s.WindowBorderSize}px solid ${s.colors.Border || 'transparent'};
              padding: ${s.WindowPadding[1]}px ${s.WindowPadding[0]}px;
              width: 360px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.5);
              font-size: 13px;
            }

            .imgui-titlebar {
              background: ${s.colors.TitleBgActive || s.colors.TitleBg};
              margin: -${s.WindowPadding[1]}px -${s.WindowPadding[0]}px ${s.WindowPadding[1]}px -${s.WindowPadding[0]}px;
              padding: 6px 12px;
              border-top-left-radius: ${s.WindowRounding}px;
              border-top-right-radius: ${s.WindowRounding}px;
              font-weight: 600;
              font-size: 13px;
              display: flex;
              justify-content: space-between;
              border-bottom: 1px solid ${s.colors.Border || 'transparent'};
            }

            .imgui-child {
              background: ${s.colors.ChildBg};
              border-radius: ${s.ChildRounding}px;
              border: 1px solid ${s.colors.Border || 'transparent'};
              padding: 10px;
              margin-bottom: ${s.ItemSpacing[1]}px;
            }

            .imgui-tabs {
              display: flex;
              gap: 2px;
              margin-bottom: ${s.ItemSpacing[1]}px;
              border-bottom: 1px solid ${s.colors.Border || '#333'};
            }

            .imgui-tab {
              background: ${s.colors.Tab};
              padding: ${s.FramePadding[1]}px ${s.FramePadding[0]}px;
              border-top-left-radius: ${s.TabRounding}px;
              border-top-right-radius: ${s.TabRounding}px;
              color: ${s.colors.TextDisabled};
              font-size: 12px;
            }
            
            .imgui-tab.active {
              background: ${s.colors.TabActive};
              color: ${s.colors.Text};
            }

            .imgui-item {
              margin-bottom: ${s.ItemSpacing[1]}px;
            }

            .imgui-input {
              background: ${s.colors.FrameBg};
              border-radius: ${s.FrameRounding}px;
              border: ${s.FrameBorderSize}px solid ${s.colors.Border || 'transparent'};
              padding: ${s.FramePadding[1]}px ${s.FramePadding[0]}px;
              color: ${s.colors.Text};
              width: 100%;
              outline: none;
            }

            .imgui-slider-container {
              display: flex;
              align-items: center;
              gap: ${s.ItemInnerSpacing[0]}px;
            }

            .imgui-slider-track {
              flex: 1;
              height: 12px;
              background: ${s.colors.FrameBg};
              border-radius: ${s.FrameRounding}px;
              position: relative;
            }

            .imgui-slider-grab {
              width: 16px;
              height: 100%;
              background: ${s.colors.SliderGrab};
              border-radius: ${s.GrabRounding}px;
              position: absolute;
              left: 40%;
            }

            .imgui-btn {
              background: ${s.colors.Button};
              border-radius: ${s.FrameRounding}px;
              padding: ${s.FramePadding[1]}px ${s.FramePadding[0]}px;
              color: ${s.colors.Text};
              border: none;
              font-size: 12px;
              cursor: pointer;
            }
            .imgui-btn:hover {
              background: ${s.colors.ButtonHovered};
            }

            .imgui-checkbox {
              display: flex;
              align-items: center;
              gap: ${s.ItemInnerSpacing[0]}px;
            }

            .imgui-check-box {
              width: 14px;
              height: 14px;
              background: ${s.colors.FrameBg};
              border-radius: ${s.FrameRounding}px;
              position: relative;
            }
            .imgui-check-box.checked::after {
              content: '';
              position: absolute;
              left: 4px; top: 1px;
              width: 3px; height: 7px;
              border: solid ${s.colors.Text};
              border-width: 0 2px 2px 0;
              transform: rotate(45deg);
            }
          </style>
        </head>
        <body>
          <div class="imgui-window">
            <div class="imgui-titlebar">
              <span>Пример меню (Cheat GUI)</span>
              <span style="color:${s.colors.TextDisabled}">✕</span>
            </div>

            <div class="imgui-tabs">
              <div class="imgui-tab active">Аимбот</div>
              <div class="imgui-tab">Валхак</div>
              <div class="imgui-tab">Настройки</div>
            </div>

            <div class="imgui-child">
              <div class="imgui-item imgui-checkbox">
                <div class="imgui-check-box checked"></div>
                <span>Включить Aimbot</span>
              </div>
              <div class="imgui-item imgui-slider-container">
                <span style="width:70px;">FOV:</span>
                <div class="imgui-slider-track">
                  <div class="imgui-slider-grab"></div>
                </div>
              </div>
            </div>

            <div class="imgui-item">
              <input type="text" class="imgui-input" value="Бинд клавиши: MOUSE5" readonly />
            </div>

            <div style="display:flex; justify-content:space-between; margin-top:12px;">
              <button class="imgui-btn">Сохранить</button>
              <button class="imgui-btn" style="background:${s.colors.Header}">Сброс</button>
            </div>
          </div>
        </body>
        </html>
        `;
      }

      function updatePreview() {
        const parsedStyle = parseStyle(editor.value);
        const previewHtml = generatePreview(parsedStyle);
        
        const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
        doc.open();
        doc.write(previewHtml);
        doc.close();
      }

      editor.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(updatePreview, 250);
      });

      document.getElementById('applyCodeBtn').addEventListener('click', updatePreview);
      window.addEventListener('DOMContentLoaded', updatePreview);
    })();
  </script>
</body>
</html>
