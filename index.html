  <script>
    // === Интерактивность (внутри iframe) ===
    (function() {
      // Перетаскивание окна
      const win = document.getElementById('mainWindow');
      const titleBar = document.getElementById('titleBar');
      let isDragging = false;
      let offsetX = 0, offsetY = 0;

      if (titleBar && win) {
        titleBar.addEventListener('mousedown', (e) => {
          if (e.target.closest('.imgui-titlebar span:last-child')) return;
          isDragging = true;
          const rect = win.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
          win.style.position = 'fixed';
          win.style.left = rect.left + 'px';
          win.style.top = rect.top + 'px';
          win.style.margin = '0';
          win.style.cursor = 'grabbing';
          document.body.style.cursor = 'grabbing';
          e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          let x = e.clientX - offsetX;
          let y = e.clientY - offsetY;
          // Ограничиваем, чтобы окно не уходило за экран
          x = Math.max(0, Math.min(window.innerWidth - win.offsetWidth, x));
          y = Math.max(0, Math.min(window.innerHeight - win.offsetHeight, y));
          win.style.left = x + 'px';
          win.style.top = y + 'px';
        });

        document.addEventListener('mouseup', () => {
          if (isDragging) {
            isDragging = false;
            win.style.cursor = 'default';
            document.body.style.cursor = 'default';
          }
        });
      }

      // Переключение вкладок
      document.querySelectorAll('.imgui-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          const tabId = this.dataset.tab;
          if (!tabId) return;
          
          // Убираем active у всех вкладок и панелей
          document.querySelectorAll('.imgui-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
          
          this.classList.add('active');
          const pane = document.getElementById('pane-' + tabId);
          if (pane) pane.classList.add('active');
        });
      });

      // Переключение чекбоксов
      document.querySelectorAll('.imgui-checkbox').forEach(item => {
        const box = item.querySelector('.imgui-check-box');
        if (box) {
          item.addEventListener('click', function(e) {
            if (e.target.closest('.imgui-check-box')) {
              box.classList.toggle('checked');
            }
          });
        }
      });

      // Слайдеры (перетаскивание ползунка)
      document.querySelectorAll('.imgui-slider-track').forEach(track => {
        const grab = track.querySelector('.imgui-slider-grab');
        if (!grab) return;
        let isDraggingSlider = false;

        track.addEventListener('mousedown', (e) => {
          isDraggingSlider = true;
          const rect = track.getBoundingClientRect();
          let percent = (e.clientX - rect.left) / rect.width;
          percent = Math.max(0, Math.min(1, percent));
          grab.style.left = (percent * 100) + '%';
          e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDraggingSlider) return;
          const rect = track.getBoundingClientRect();
          let percent = (e.clientX - rect.left) / rect.width;
          percent = Math.max(0, Math.min(1, percent));
          grab.style.left = (percent * 100) + '%';
        });

        document.addEventListener('mouseup', () => {
          isDraggingSlider = false;
        });
      });

      // Кнопки (обратная связь)
      document.querySelectorAll('.imgui-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const originalText = this.textContent;
          this.textContent = '✓ Готово';
          setTimeout(() => {

      // Закрытие окна (крестик)
      const closeBtn = document.querySelector('.imgui-titlebar span:last-child');

        closeBtn.addEventListener('click', function() {
          const win = document.getElementById('mainWindow');
          if (win) {
            win.style.transition = 'opacity 0.3s, transform 0.3s';
            win.style.opacity = '0';
            win.style.transform = 'scale(0.9)';
            setTimeout(() => {
              win.style.display = 'none';
            }, 300);
          }
        });
      }
    })();

      // Парсинг C++ кода в CSS-переменные
      function parseCppToCSS(code) {
        let cssVars = ':root {\n';
        const lines = code.split('\n');

        lines.forEach(line => {
          const floatMatch = line.match(/style\.([A-Za-z0-9_]+)\s*=\s*([0-9.]+)/);
          if (floatMatch) {
            cssVars += `  --${floatMatch[1]}: ${floatMatch[2]}px;\n`;
          }

          const vec2Match = line.match(/style\.([A-Za-z0-9_]+)\s*=\s*ImVec2\s*\(\s*([0-9.]+)\s*,\s*([0-9.]+)\s*\)/);
          if (vec2Match) {
            cssVars += `  --${vec2Match[1]}-X: ${vec2Match[2]}px;\n`;
            cssVars += `  --${vec2Match[1]}-Y: ${vec2Match[3]}px;\n`;
          }

          const colMatch = line.match(/colors\s*\[\s*ImGuiCol_([A-Za-z0-9_]+)\s*\]\s*=\s*ImVec4\s*\(\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*\)/);
          if (colMatch) {
            const name = colMatch[1];
            const r = Math.round(Math.min(1, Math.max(0, parseFloat(colMatch[2]))) * 255);
            const g = Math.round(Math.min(1, Math.max(0, parseFloat(colMatch[3]))) * 255);
            const b = Math.round(Math.min(1, Math.max(0, parseFloat(colMatch[4]))) * 255);
            const a = Math.min(1, Math.max(0, parseFloat(colMatch[5])));
            cssVars += `  --col-${name}: rgba(${r}, ${g}, ${b}, ${a});\n`;
          }
        });

        cssVars += '}';
        return cssVars;
      }

      function updateTheme() {
        const frameDoc = previewFrame.contentDocument || (previewFrame.contentWindow && previewFrame.contentWindow.document);
        if (!frameDoc) return;

        const fullCode = editor.value;
        
        // Извлекаем HTML (всё что до тега <style id="cppStyles">)
        let htmlPart = fullCode;
        let cppPart = '';
        
        const styleTagMatch = fullCode.match(/<style\s+id="cppStyles">([\s\S]*?)<\/style>/);
        if (styleTagMatch) {
          cppPart = styleTagMatch[1];
          htmlPart = fullCode.replace(/<style\s+id="cppStyles">[\s\S]*?<\/style>/, '').trim();
        }

        // Извлекаем HTML-содержимое (то что внутри body)
        const bodyMatch = htmlPart.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        let bodyHTML = htmlPart;
        if (bodyMatch) {
          bodyHTML = bodyMatch[1];
        }

        // Обновляем iframe
        const frameHTML = getFrameTemplate(bodyHTML);
        previewFrame.srcdoc = frameHTML;

        // После загрузки применяем стили
        previewFrame.addEventListener('load', function onLoad() {
          previewFrame.removeEventListener('load', onLoad);
          const doc = previewFrame.contentDocument || previewFrame.contentWindow?.document;
          if (doc) {
            const styleEl = doc.getElementById('dynamicStyles');
            if (styleEl) {
              styleEl.textContent = parseCppToCSS(cppPart);
            }
          }
        });
      }

      function initIframe() {
        updateTheme();
      }

      // Автоматическое обновление при вводе
      editor.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(updateTheme, 400);
      });

      document.getElementById('applyCodeBtn').addEventListener('click', updateTheme);

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initIframe);
      } else {
        initIframe();
      }
    })();
  </script>
</body>
