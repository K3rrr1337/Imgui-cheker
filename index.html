<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImGui C++ Style Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d14;
            color: #c0c0d0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== Шапка ===== */
        .toolbar {
            background: #161622;
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #262638;
            flex-shrink: 0;
        }

        .toolbar .title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #569cd6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar .title code {
            background: #222233;
            padding: 2px 6px;
            border-radius: 4px;
            color: #ce9178;
            font-size: 0.8rem;
        }

        .toolbar button {
            background: #252538;
            border: 1px solid #3d3d5c;
            color: #d0d0e0;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .toolbar button:hover {
            background: #32324e;
            border-color: #565680;
            color: #ffffff;
        }

        /* ===== Двухколоночный макет ===== */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 48px);
            overflow: hidden;
        }

        /* ===== ЛЕВАЯ СТОРОНА: C++ Редактор ===== */
        .editor-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            border-right: 2px solid #282838;
            min-width: 320px;
        }

        .panel-header {
            background: #181824;
            padding: 8px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #707090;
            border-bottom: 1px solid #262638;
            display: flex;
            justify-content: space-between;
        }

        #cpp-editor {
            flex: 1;
            width: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            outline: none;
            padding: 16px;
            font-family: 'Consolas', 'Cascadia Code', 'Fira Code', monospace;
            font-size: 13.5px;
            line-height: 1.6;
            resize: none;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
        }

        /* ===== ПРАВАЯ СТОРОНА: Превью ImGui ===== */
        .preview-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #12121c;
            min-width: 320px;
        }

        .preview-viewport {
            flex: 1;
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#1e1e30 1px, transparent 1px);
            background-size: 18px 18px;
            overflow: auto;
        }

        /* ===== Эмулятор интерфейса Dear ImGui ===== */
        #imgui-window {
            width: 440px;
            background: rgba(20, 20, 20, 0.95);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            user-select: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 13px;
            transition: all 0.1s ease-out;
        }

        #imgui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        #imgui-body {
            display: flex;
            flex-direction: column;
        }

        #imgui-child {
            display: flex;
            flex-direction: column;
        }

        .imgui-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .imgui-widget {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .imgui-checkbox-box {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }

        .imgui-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 500;
        }

        .imgui-slider-bg {
            width: 100%;
            height: 18px;
            position: relative;
            cursor: ew-resize;
            overflow: hidden;
        }

        .imgui-slider-fill {
            height: 100%;
            width: 45%;
        }

        .imgui-slider-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
        }

        .imgui-input {
            width: 100%;
            border: none;
            outline: none;
        }

        .imgui-tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .imgui-tab {
            padding: 4px 12px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .workspace { flex-direction: column; }
            .editor-side, .preview-side { flex: 1; min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="title">
            <span>🛠️ Dear ImGui C++ Style Designer</span>
            <code>ImGuiStyle& style</code>
        </div>
        <button id="copyBtn">📋 Скопировать C++ код</button>
    </div>

    <div class="workspace">

        <!-- ЛЕВАЯ ПАНЕЛЬ: C++ Редактор -->
        <div class="editor-side">
            <div class="panel-header">
                <span>C++ Style Function</span>
                <span id="char-counter">0 символов</span>
            </div>
            <textarea id="cpp-editor" spellcheck="false"></textarea>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ: Live Превью ImGui -->
        <div class="preview-side">
            <div class="panel-header">
                <span>ImGui Preview (C++ Engine)</span>
                <span>Live View</span>
            </div>
            <div class="preview-viewport">
                
                <div id="imgui-window">
                    <div id="imgui-header">
                        <span>Cheat Menu v2.0 (Dear ImGui)</span>
                        <span style="opacity: 0.6; cursor: pointer;">_ X</span>
                    </div>

                    <div id="imgui-body">
                        <div class="imgui-tabs">
                            <div class="imgui-tab" id="tab-active">Aimbot</div>
                            <div class="imgui-tab">Visuals</div>
                            <div class="imgui-tab">Misc</div>
                            <div class="imgui-tab">Settings</div>
                        </div>

                        <div id="imgui-child">
                            <div class="imgui-row">
                                <label class="imgui-widget">
                                    <div class="imgui-checkbox-box" id="cb1">✓</div>
                                    <span style="margin-left: 8px;" id="text-main">Enable Master Switch</span>
                                </label>
                            </div>

                            <div class="imgui-row">
                                <label class="imgui-widget">
                                    <div class="imgui-checkbox-box" id="cb2"></div>
                                    <span style="margin-left: 8px;">Silent Aim</span>
                                </label>
                            </div>

                            <div style="margin-top: 4px;">
                                <div style="font-size: 11px; margin-bottom: 3px;" id="text-sub">FOV Radius: 45.0f</div>
                                <div class="imgui-slider-bg" id="slider-bg">
                                    <div class="imgui-slider-fill" id="slider-fill"></div>
                                    <div class="imgui-slider-text" id="text-slider">45.0f</div>
                                </div>
                            </div>

                            <div style="margin-top: 4px;">
                                <div style="font-size: 11px; margin-bottom: 3px;">Config Name</div>
                                <div class="imgui-input" id="input-bg" style="padding: 4px 8px;">default_preset</div>
                            </div>

                            <div class="imgui-row" style="margin-top: 6px;">
                                <div class="imgui-button" id="btn-main">Save Config</div>
                                <div class="imgui-button" id="btn-sec">Load Config</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        (function() {
            const editor = document.getElementById('cpp-editor');
            const charCounter = document.getElementById('char-counter');
            const copyBtn = document.getElementById('copyBtn');

            const defaultCppCode = 'static void styleForGUI() {\n' +
                '    ImGuiStyle &style = ImGui::GetStyle();\n\n' +
                '    // Скругления углов\n' +
                '    style.WindowRounding = 8.0f;\n' +
                '    style.ChildRounding = 6.0f;\n' +
                '    style.FrameRounding = 4.0f;\n' +
                '    style.PopupRounding = 6.0f;\n' +
                '    style.ScrollbarRounding = 4.0f;\n' +
                '    style.GrabRounding = 4.0f;\n' +
                '    style.TabRounding = 4.0f;\n\n' +
                '    // Отступы и размеры\n' +
                '    style.WindowPadding = ImVec2(14, 14);\n' +
                '    style.FramePadding = ImVec2(8, 6);\n' +
                '    style.ItemSpacing = ImVec2(10, 10);\n' +
                '    style.WindowBorderSize = 1.0f;\n' +
                '    style.FrameBorderSize = 1.0f;\n\n' +
                '    // Цветовая схема\n' +
                '    ImVec4* colors = style.Colors;\n' +
                '    colors[ImGuiCol_WindowBg]         = ImVec4(0.10f, 0.10f, 0.13f, 0.95f);\n' +
                '    colors[ImGuiCol_ChildBg]          = ImVec4(0.14f, 0.14f, 0.18f, 0.60f);\n' +
                '    colors[ImGuiCol_Border]           = ImVec4(0.25f, 0.25f, 0.35f, 0.50f);\n' +
                '    colors[ImGuiCol_FrameBg]          = ImVec4(0.18f, 0.18f, 0.24f, 1.00f);\n' +
                '    colors[ImGuiCol_FrameBgHovered]   = ImVec4(0.24f, 0.24f, 0.32f, 1.00f);\n' +
                '    colors[ImGuiCol_FrameBgActive]    = ImVec4(0.30f, 0.30f, 0.40f, 1.00f);\n' +
                '    colors[ImGuiCol_TitleBg]          = ImVec4(0.08f, 0.08f, 0.10f, 1.00f);\n' +
                '    colors[ImGuiCol_TitleBgActive]    = ImVec4(0.14f, 0.14f, 0.18f, 1.00f);\n' +
                '    colors[ImGuiCol_Button]           = ImVec4(0.26f, 0.59f, 0.98f, 0.40f);\n' +
                '    colors[ImGuiCol_ButtonHovered]    = ImVec4(0.26f, 0.59f, 0.98f, 1.00f);\n' +
                '    colors[ImGuiCol_ButtonActive]     = ImVec4(0.06f, 0.53f, 0.98f, 1.00f);\n' +
                '    colors[ImGuiCol_Header]           = ImVec4(0.26f, 0.59f, 0.98f, 0.31f);\n' +
                '    colors[ImGuiCol_HeaderHovered]    = ImVec4(0.26f, 0.59f, 0.98f, 0.80f);\n' +
                '    colors[ImGuiCol_Text]             = ImVec4(0.92f, 0.92f, 0.95f, 1.00f);\n' +
                '    colors[ImGuiCol_TextDisabled]     = ImVec4(0.50f, 0.50f, 0.55f, 1.00f);\n' +
                '    colors[ImGuiCol_CheckMark]        = ImVec4(0.26f, 0.59f, 0.98f, 1.00f);\n' +
                '    colors[ImGuiCol_SliderGrab]       = ImVec4(0.24f, 0.52f, 0.88f, 1.00f);\n' +
                '}';

            function parseImGuiCpp(cppText) {
                const styles = {
                    WindowRounding: 8, ChildRounding: 6, FrameRounding: 4, TabRounding: 4,
                    WindowPadding: [14, 14], FramePadding: [8, 6], ItemSpacing: [10, 10],
                    WindowBorderSize: 1, FrameBorderSize: 1, colors: {}
                };

                function imVec4ToRgba(str) {
                    const match = str.match(/ImVec4\s*\(\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*\)/);
                    if (match) {
                        const r = Math.round(parseFloat(match[1]) * 255);
                        const g = Math.round(parseFloat(match[2]) * 255);
                        const b = Math.round(parseFloat(match[3]) * 255);
                        const a = parseFloat(match[4]);
                        return `rgba(${r}, ${g}, ${b}, ${a})`;
                    }
                    return null;
                }

                const floatMatches = cppText.matchAll(/style\.([A-Za-z0-9_]+)\s*=\s*([0-9.]+)[fF]?/g);
                for (const m of floatMatches) styles[m[1]] = parseFloat(m[2]);

                const vecMatches = cppText.matchAll(/style\.([A-Za-z0-9_]+)\s*=\s*ImVec2\s*\(\s*([0-9.]+)[fF]?\s*,\s*([0-9.]+)[fF]?\s*\)/g);
                for (const m of vecMatches) styles[m[1]] = [parseFloat(m[2]), parseFloat(m[3])];

                const colorMatches = cppText.matchAll(/colors\s*\[\s*([A-Za-z0-9_]+)\s*\]\s*=\s*(ImVec4\s*\([^)]+\))/g);
                for (const m of colorMatches) {
                    const rgba = imVec4ToRgba(m[2]);
                    if (rgba) styles.colors[m[1]] = rgba;
                }

                return styles;
            }

            function applyStyle() {
                const code = editor.value;
                const s = parseImGuiCpp(code);

                const windowEl = document.getElementById('imgui-window');
                const headerEl = document.getElementById('imgui-header');
                const bodyEl = document.getElementById('imgui-body');
                const childEl = document.getElementById('imgui-child');
                
                const cbs = [document.getElementById('cb1'), document.getElementById('cb2')];
                const btnMain = document.getElementById('btn-main');
                const btnSec = document.getElementById('btn-sec');
                const sliderBg = document.getElementById('slider-bg');
                const sliderFill = document.getElementById('slider-fill');
                const inputBg = document.getElementById('input-bg');
                const tabActive = document.getElementById('tab-active');

                windowEl.style.borderRadius = `${s.WindowRounding || 0}px`;
                childEl.style.borderRadius = `${s.ChildRounding || 0}px`;
                
                const frameRound = `${s.FrameRounding || 0}px`;
                cbs.forEach(cb => cb.style.borderRadius = frameRound);
                btnMain.style.borderRadius = frameRound;
                btnSec.style.borderRadius = frameRound;
                sliderBg.style.borderRadius = frameRound;
                inputBg.style.borderRadius = frameRound;

                if (tabActive) tabActive.style.borderRadius = `${s.TabRounding || 0}px ${s.TabRounding || 0}px 0 0`;

                if (s.WindowPadding) {
                    bodyEl.style.padding = `${s.WindowPadding[1]}px ${s.WindowPadding[0]}px`;
                    headerEl.style.padding = `${s.WindowPadding[1] * 0.6}px ${s.WindowPadding[0]}px`;
                }
                if (s.ItemSpacing) {
                    childEl.style.gap = `${s.ItemSpacing[1]}px`;
                    bodyEl.style.gap = `${s.ItemSpacing[1]}px`;
                }
                if (s.FramePadding) {
                    const fp = `${s.FramePadding[1]}px ${s.FramePadding[0]}px`;
                    btnMain.style.padding = fp;
                    btnSec.style.padding = fp;
                    childEl.style.padding = `${s.FramePadding[1] * 2}px ${s.FramePadding[0] * 1.5}px`;
                }

                windowEl.style.border = `${s.WindowBorderSize || 0}px solid ${s.colors.ImGuiCol_Border || '#333'}`;
                childEl.style.border = `${s.FrameBorderSize || 0}px solid ${s.colors.ImGuiCol_Border || 'transparent'}`;
                inputBg.style.border = `${s.FrameBorderSize || 0}px solid ${s.colors.ImGuiCol_Border || 'transparent'}`;

                if (s.colors.ImGuiCol_WindowBg) windowEl.style.backgroundColor = s.colors.ImGuiCol_WindowBg;
                if (s.colors.ImGuiCol_TitleBgActive || s.colors.ImGuiCol_TitleBg) {
                    headerEl.style.backgroundColor = s.colors.ImGuiCol_TitleBgActive || s.colors.ImGuiCol_TitleBg;
                }
                if (s.colors.ImGuiCol_ChildBg) childEl.style.backgroundColor = s.colors.ImGuiCol_ChildBg;

                windowEl.style.color = s.colors.ImGuiCol_Text || '#fff';

                if (s.colors.ImGuiCol_Button) btnMain.style.backgroundColor = s.colors.ImGuiCol_Button;
                if (s.colors.ImGuiCol_FrameBg) {
                    btnSec.style.backgroundColor = s.colors.ImGuiCol_FrameBg;
                    cbs.forEach(cb => cb.style.backgroundColor = s.colors.ImGuiCol_FrameBg);
                    sliderBg.style.backgroundColor = s.colors.ImGuiCol_FrameBg;
                    inputBg.style.backgroundColor = s.colors.ImGuiCol_FrameBg;
                }

                if (s.colors.ImGuiCol_CheckMark) cbs[0].style.color = s.colors.ImGuiCol_CheckMark;
                if (s.colors.ImGuiCol_SliderGrab) sliderFill.style.backgroundColor = s.colors.ImGuiCol_SliderGrab;
                if (tabActive && s.colors.ImGuiCol_Header) tabActive.style.backgroundColor = s.colors.ImGuiCol_Header;

                charCounter.textContent = code.length + ' символов';
            }

            editor.addEventListener('input', applyStyle);

            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(editor.value).then(() => {
                    const orig = copyBtn.textContent;
                    copyBtn.textContent = '✅ Скопировано!';
                    setTimeout(() => copyBtn.textContent = orig, 1500);
                });
            });

            editor.value = defaultCppCode;
            applyStyle();
        })();
    </script>
</body>
</html>
